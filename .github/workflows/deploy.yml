name: Deploy Nuestra Familia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Generate calendar events from iCal feeds
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: npm run generate:ical:feeds
        env:
          ICAL_FAMILIAR_URL: ${{ secrets.ICAL_FAMILIAR_URL }}
          ICAL_MASTER_URL: ${{ secrets.ICAL_MASTER_URL }}
          ICAL_CARRERAS_URL: ${{ secrets.ICAL_CARRERAS_URL }}
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
